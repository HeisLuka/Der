name: Analyze PUB competitor matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-pub-competitors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: canyua-publisher
            package_id: com.canyua.publisherexpert
          - slug: smartapps38-pub2pdf
            package_id: smartapps38.convert.publisher.topdf.pubtopdf
          - slug: onlineconverting-pub2pdf
            package_id: com.daemon.publishertopdfconverter

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PACKAGE_ID: ${{ matrix.package_id }}
      SLUG: ${{ matrix.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt unzip jq ripgrep file binutils
          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-.*\\.zip$")) | .browser_download_url' \
            | head -n1)"
          test -n "$JADX_URL"
          curl -fL "$JADX_URL" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d "$RUNNER_TEMP/jadx"
          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"

      - name: Download package
        run: |
          mkdir -p work/download
          docker run --rm \
            -v "$PWD/work/download:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a "$PACKAGE_ID" -d apk-pure /output
          find work/download -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Unpack package and locate base APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/unpacked work/report

          PACKAGE_FILE="$(find work/download -maxdepth 1 -type f | head -n1)"
          test -n "$PACKAGE_FILE"

          case "$PACKAGE_FILE" in
            *.xapk|*.apks|*.zip)
              unzip -q "$PACKAGE_FILE" -d work/unpacked
              ;;
            *.apk)
              cp "$PACKAGE_FILE" work/unpacked/base.apk
              ;;
            *)
              if file "$PACKAGE_FILE" | grep -qi 'zip archive'; then
                unzip -q "$PACKAGE_FILE" -d work/unpacked
              else
                echo "Unsupported downloaded format: $PACKAGE_FILE" >&2
                exit 1
              fi
              ;;
          esac

          BASE_APK=""
          while IFS= read -r apk; do
            badge="$(aapt dump badging "$apk" 2>/dev/null | head -n1 || true)"
            if [ -n "$badge" ] && ! grep -q " split='" <<<"$badge"; then
              BASE_APK="$apk"
              break
            fi
          done < <(find work/unpacked -type f -name '*.apk' | sort)

          if [ -z "$BASE_APK" ]; then
            BASE_APK="$(find work/unpacked -type f \( -name 'base.apk' -o -name "$PACKAGE_ID.apk" \) | head -n1)"
          fi

          test -n "$BASE_APK"
          echo "base_apk=$BASE_APK" >> "$GITHUB_OUTPUT"
          echo "Selected base APK: $BASE_APK"
          aapt dump badging "$BASE_APK" | head -n 8

      - name: Decompile base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="${{ steps.apk.outputs.base_apk }}"
          mkdir -p work/jadx
          jadx --show-bad-code --no-debug-info -d work/jadx "$BASE_APK" >/tmp/jadx.log 2>&1 || true
          tail -n 120 /tmp/jadx.log > work/report/jadx.log

      - name: Build forensic report
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="${{ steps.apk.outputs.base_apk }}"
          REPORT=work/report/report.md

          {
            echo "# PUB competitor static analysis"
            echo
            echo "- Slug: `$SLUG`"
            echo "- Package: `$PACKAGE_ID`"
            echo "- Base APK: `$BASE_APK`"
            echo "- Base SHA-256: `$(sha256sum "$BASE_APK" | awk '{print $1}')`"
            echo "- Base size: `$(stat -c%s "$BASE_APK") bytes`"
            echo
            echo "## APK splits"
            echo '~~~text'
            while IFS= read -r apk; do
              size="$(stat -c%s "$apk")"
              badge="$(aapt dump badging "$apk" 2>/dev/null | head -n1 || true)"
              printf '%s\t%s bytes\t%s\n' "$apk" "$size" "$badge"
            done < <(find work/unpacked -type f -name '*.apk' | sort)
            echo '~~~'
            echo
            echo "## Permissions"
            echo '~~~text'
            aapt dump permissions "$BASE_APK" || true
            echo '~~~'
          } > "$REPORT"

          ALL_ENTRIES="$(for apk in $(find work/unpacked -type f -name '*.apk' | sort); do unzip -Z1 "$apk" 2>/dev/null || true; done)"
          FRAMEWORK="Native Android / undetermined"
          grep -q 'libflutter.so' <<<"$ALL_ENTRIES" && FRAMEWORK="Flutter"
          grep -Eq 'libreactnativejni.so|index.android.bundle' <<<"$ALL_ENTRIES" && FRAMEWORK="React Native"
          grep -Eq 'assets/www/|cordova.js' <<<"$ALL_ENTRIES" && FRAMEWORK="Cordova / WebView hybrid"
          grep -q 'libunity.so' <<<"$ALL_ENTRIES" && FRAMEWORK="Unity"
          grep -Eq 'libmonodroid.so|assemblies/' <<<"$ALL_ENTRIES" && FRAMEWORK="Xamarin / .NET Android"

          {
            echo
            echo "## Framework"
            echo
            echo "**Detected:** $FRAMEWORK"
            echo
            echo "Relevant entries:"
            echo '~~~text'
            grep -E 'libflutter.so|libapp.so|flutter_assets|libreactnativejni.so|index.android.bundle|assets/www/|cordova.js|libunity.so|libmonodroid.so|assemblies/' <<<"$ALL_ENTRIES" | sort -u | head -n 300 || true
            echo '~~~'
            echo
            echo "## Native libraries"
            echo '~~~text'
            for apk in $(find work/unpacked -type f -name '*.apk' | sort); do
              entries="$(unzip -Z1 "$apk" 2>/dev/null | grep -E '^lib/.+\.so$' || true)"
              if [ -n "$entries" ]; then
                echo "### $apk"
                echo "$entries"
              fi
            done
            echo '~~~'
          } >> "$REPORT"

          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("work/jadx")
          urls = set()
          pat = re.compile(r'https?://[^\s"\'<>\\)]+')
          for p in root.rglob("*"):
              if not p.is_file() or p.stat().st_size > 6_000_000:
                  continue
              try:
                  text = p.read_text(errors="ignore")
              except Exception:
                  continue
              for u in pat.findall(text):
                  if len(u) <= 400:
                      urls.add(u.rstrip(".,;"))
          pathlib.Path("work/report/urls.txt").write_text("\n".join(sorted(urls)) + ("\n" if urls else ""))
          PY

          {
            echo
            echo "## URLs / endpoints from decompiled base"
            echo '~~~text'
            head -n 400 work/report/urls.txt || true
            echo '~~~'
            echo
            echo "## PUB engine / upload / conversion clues"
            echo '~~~text'
            rg -i -n --no-heading \
              'libmspub|mspub|publisher|\.pub|compound file|ole2|cfb|quill|escher|libreoffice|librevenge|multipart|upload|convert|conversion|retrofit|okhttp|volley|webview|preview|pdf|endpoint|baseurl|api/' \
              work/jadx/sources work/jadx/resources 2>/dev/null \
              | sed -E 's/[A-Za-z0-9_=-]{40,}/<REDACTED_LONG_TOKEN>/g' \
              | head -n 1200 || true
            echo '~~~'
            echo
            echo "## Native engine fingerprints"
            echo '~~~text'
            mkdir -p work/native
            for apk in $(find work/unpacked -type f -name '*.apk' | sort); do
              while IFS= read -r so; do
                [ -n "$so" ] || continue
                out="work/native/$(basename "$apk")__$(basename "$so")"
                unzip -p "$apk" "$so" > "$out"
                hits="$(strings "$out" | grep -Ei 'libmspub|mspub|publisher|libreoffice|librevenge|compound file|ole2|cfb|quill|escher|pdfium|mupdf|poppler|skia|flutter' | head -n 160 || true)"
                if [ -n "$hits" ]; then
                  echo "### $apk :: $so"
                  echo "$hits"
                fi
              done < <(unzip -Z1 "$apk" 2>/dev/null | grep -E '^lib/.+\.so$' || true)
            done
            echo '~~~'
          } >> "$REPORT"

          cat "$REPORT"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.slug }}
          path: work/report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.slug }}
          path: work/download/*
          if-no-files-found: error
          retention-days: 14
