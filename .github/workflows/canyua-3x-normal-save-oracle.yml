name: Canyua 3.1.27 normal Save oracle

on:
  pull_request:
    paths:
      - ".github/workflows/canyua-3x-normal-save-oracle.yml"
      - "experiments/run-canyua-3x-normal-save-oracle.sh"
      - "experiments/diff-pub-cfb.py"
      - "experiments/inspect-canyua-package.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Acquire and admit Canyua 3.1.27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/acquire work/runtime work/report

          docker run --rm             -v "$PWD/work/acquire:/output"             ghcr.io/efforg/apkeep:stable             -a "com.canyua.publisherexpert@3.1.27"             -d apk-pure /output             > work/report/download.stdout             2> work/report/download.stderr

          APK="$(find work/acquire -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"

          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          EXPECTED_SHA='23a1511478458776594e48d7f0d1dbd7e9ba7145e338dfc90bfe80fdcc0c4682'
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          python3 experiments/inspect-canyua-package.py             "$APK"             --json work/report/inspection.json             --require-eligible             > work/report/inspection.stdout

          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("work/report/inspection.json").read_text())
          assert r["pairip_present"] is False, r
          assert r["reader_markers_present"] is True, r
          assert r["writer_markers_present"] is True, r
          assert r["admission"] == "eligible_for_normal_runtime_probe", r
          assert "arm64-v8a" in r["abis"], r
          PY

          cp "$APK" work/runtime/canyua-3.1.27.apk
          printf '%s\n' "$ACTUAL_SHA" > work/runtime/package.sha256

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canyua-3.1.27-normal-save-acquisition
          path: work/report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: canyua-3.1.27-normal-save-runtime
          path: work/runtime/
          if-no-files-found: error
          retention-days: 7

  oracle:
    needs: acquire
    runs-on: macos-14
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      - name: Download admitted Canyua 3.1.27
        uses: actions/download-artifact@v4
        with:
          name: canyua-3.1.27-normal-save-runtime
          path: work/runtime

      - name: Install CFB diff dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check olefile

      - name: Download pinned PUB control
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             https://raw.githubusercontent.com/apache/poi/74700b5692fd0449031ac6a3c78aec1155d144d5/test-data/publisher/Sample.pub             -o work/Sample.pub
          actual="$(shasum -a 256 work/Sample.pub | awk '{print $1}')"
          expected='6fefdef46b87c767150878dc384549cb2d2ec2ac54de25f8ddb3a5628301107e'
          test "$actual" = "$expected"

      - name: Run ordinary offline Save oracle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-snapshot
            -noaudio
            -no-boot-anim
            -no-window
            -no-metrics
            -accel off
            -gpu swiftshader_indirect
          script: bash experiments/run-canyua-3x-normal-save-oracle.sh

      - name: Upload normal-Save oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canyua-3.1.27-normal-save-oracle
          path: work/dynamic/
          if-no-files-found: warn
          retention-days: 30
