name: Validate PUB root DOCUMENT generator

on:
  push:
    paths:
      - "experiments/generate-pub2c-root-document.py"
      - ".github/workflows/pub2c-root-document-generator.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find Canyua package artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=package-canyua-publisher&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p work/package
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > work/package.zip
          unzip -q work/package.zip -d work/package
          XAPK="$(find work/package -type f -name '*.xapk' -print -quit)"
          test -n "$XAPK"
          unzip -p "$XAPK" com.canyua.publisherexpert.apk > work/base.apk
      - name: Validate structured DOCUMENT generator
        run: |
          python3 -m pip install --disable-pip-version-check olefile
          python3 experiments/generate-pub2c-root-document.py work/base.apk
