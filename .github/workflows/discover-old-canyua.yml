name: Discover old Canyua package source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-old-canyua.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Aptoide app metadata with versions node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          API1='https://ws75.aptoide.com/api/7/app/get?package_name=com.canyua.publisherexpert&nodes=meta%2Cversions'
          API2='https://ws2.aptoide.com/api/7/app/getMeta?package_name=com.canyua.publisherexpert'
          PAGE='https://apkcombo.com/publisher-for-ms-office/com.canyua.publisherexpert/download/phone-3.1.10-apk'

          : > work/query-url.txt
          for spec in "app-get.json|$API1" "get-meta.json|$API2" "versions.html|$PAGE"; do
            name="${spec%%|*}"
            url="${spec#*|}"
            echo "$name $url" | tee -a work/query-url.txt
            code="$(curl -A 'Mozilla/5.0' -L --compressed -sS -o "work/$name" -w '%{http_code}' "$url" || true)"
            echo "$name http=$code" | tee -a work/query-url.txt
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          payloads=[]
          for name in ("app-get.json", "get-meta.json"):
              p=Path("work")/name
              if not p.exists():
                  continue
              try:
                  data=json.loads(p.read_text())
              except Exception as exc:
                  print(name, "not JSON:", exc)
                  continue
              payloads.append((name, data))

          def walk(node, trail="root"):
              if isinstance(node, dict):
                  if "vername" in node:
                      rows.append({
                          "trail": trail,
                          "vername": node.get("vername"),
                          "vercode": node.get("vercode"),
                          "md5sum": node.get("md5sum"),
                          "path": node.get("path"),
                          "filesize": node.get("filesize") or node.get("size"),
                          "signature": node.get("signature"),
                      })
                  for k,v in node.items():
                      walk(v, trail+"."+str(k))
              elif isinstance(node, list):
                  for i,v in enumerate(node):
                      walk(v, trail+f"[{i}]")

          for name, data in payloads:
              print("--- walking", name, "---")
              walk(data, name)

          html_path=Path("work/versions.html")
          if html_path.exists():
              html=html_path.read_text(errors="replace")
              import re
              snippets=[]
              for m in re.finditer(r"3\.1\.10", html, flags=re.I):
                  a=max(0,m.start()-1500); b=min(len(html),m.end()+2500)
                  snippets.append(html[a:b])
              Path("work/html-3.1.10-context.txt").write_text("\n\n--- MATCH ---\n\n".join(snippets))
              hrefs=sorted(set(re.findall(r'href=["\\\']([^"\\\']+)["\\\']', "\n".join(snippets), flags=re.I)))
              urls=sorted(set(re.findall(r'https?://[^"\\\'<> ]+', "\n".join(snippets), flags=re.I)))
              Path("work/html-candidates.txt").write_text("\n".join(hrefs+urls)+"\n")
              print("HTML 3.1.10 matches:", len(snippets))
              for item in hrefs+urls:
                  print("HTML candidate:", item)

          dedup={}
          for row in rows:
              key=(str(row.get("vername")), str(row.get("vercode")), str(row.get("path")))
              dedup[key]=row
          rows=list(dedup.values())

          def vkey(row):
              text=str(row.get("vername") or "")
              parts=[]
              for piece in text.replace("-", ".").split("."):
                  try:
                      parts.append(int(piece))
                  except ValueError:
                      parts.append(-1)
              return tuple(parts)

          rows.sort(key=vkey, reverse=True)
          Path("work/version-candidates.json").write_text(
              json.dumps(rows, indent=2, ensure_ascii=False)+"\n"
          )

          for name, data in payloads:
              print(name, "status:", (data.get("info") or {}).get("status"))
          print("version candidates:", len(rows))
          for row in rows:
              print(row.get("vername"), row.get("vercode"), row.get("filesize"), row.get("path"))

          target=next((r for r in rows if str(r.get("vername"))=="3.1.10" and r.get("path")), None)
          if target is None:
              older=[r for r in rows if r.get("path") and vkey(r) < (5,1,1)]
              target=older[-1] if older else None

          if target:
              Path("work/target.json").write_text(
                  json.dumps(target, indent=2, ensure_ascii=False)+"\n"
              )
              print("--- selected target ---")
              print(Path("work/target.json").read_text())
          else:
              print("No downloadable historical target found in app/get response")
          PY

      - name: Download selected historical APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f work/target.json ]; then
            echo "No Aptoide binary target. The HTML probe is retained as evidence."
            exit 0
          fi
          URL="$(python3 -c 'import json; print(json.load(open("work/target.json"))["path"])')"
          curl -A 'Mozilla/5.0' -L --fail --retry 3 --connect-timeout 20 "$URL" -o work/canyua-old.apk
          sha256sum work/canyua-old.apk | tee work/sha256.txt
          file work/canyua-old.apk | tee work/file.txt
          unzip -t work/canyua-old.apk >/dev/null

      - name: Inspect ABI and protection markers
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f work/canyua-old.apk ]; then
            echo "No historical APK downloaded; skipping binary inspection."
            exit 0
          fi
          unzip -Z1 work/canyua-old.apk | grep -E '^lib/[^/]+/[^/]+\.so$' | sort | tee work/native-files.txt || true
          unzip -Z1 work/canyua-old.apk | grep -Ei 'pairip|licensecheck|libmspub|libpubBuilder|Publisher Data|\.so$' | sort | tee work/interesting-files.txt || true

          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          apk=Path("work/canyua-old.apk")
          z=zipfile.ZipFile(apk)
          names=z.namelist()

          abis=sorted({name.split("/")[1] for name in names if name.startswith("lib/") and name.count("/") >= 2})
          native=[name for name in names if name.startswith("lib/") and name.endswith(".so")]

          marker_needles={
              "pairip": [b"com/pairip", b"com.pairip", b"licensecheck", b"LicenseActivity"],
              "mspub": [b"libmspub", b"mspubCore", b"MSPUBDocument"],
              "writer": [b"libpubBuilder", b"createPub", b"MSPUBBuilder"],
          }
          hits={k:[] for k in marker_needles}

          scan_names=[n for n in names if n.endswith(".dex") or n=="AndroidManifest.xml" or n.endswith(".so")]
          for name in scan_names:
              try:
                  blob=z.read(name)
              except Exception:
                  continue
              low=blob.lower()
              for group, needles in marker_needles.items():
                  for needle in needles:
                      if needle.lower() in low:
                          hits[group].append({"file":name,"needle":needle.decode("ascii","replace")})

          report={
              "schema":"der/canyua-old-apk-inspection/v1",
              "target":json.loads(Path("work/target.json").read_text()),
              "abis":abis,
              "native_library_count":len(native),
              "native_libraries":native,
              "marker_hits":hits,
          }
          Path("work/inspection.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False)+"\n"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-canyua-discovery-metadata
          path: |
            work/query-url.txt
            work/app-get.json
            work/get-meta.json
            work/versions.html
            work/html-3.1.10-context.txt
            work/html-candidates.txt
            work/version-candidates.json
            work/target.json
            work/sha256.txt
            work/file.txt
            work/native-files.txt
            work/interesting-files.txt
            work/inspection.json
          if-no-files-found: warn
          retention-days: 30
