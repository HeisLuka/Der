name: Discover old Canyua package source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-old-canyua.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public 3.1.35 archive page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          URL='https://ff.phoneky.com/android/?id=d1d262450'
          curl -A 'Mozilla/5.0' -L --fail --compressed "$URL" -o work/page.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from pathlib import Path

          base='https://ff.phoneky.com/android/?id=d1d262450'
          html=Path('work/page.html').read_text(errors='replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag in ('a','form','input','button','iframe','script'):
                      self.items.append((tag,d))
          p=P(); p.feed(html)

          for tag,d in p.items:
              vals=' '.join(f'{k}={v}' for k,v in d.items())
              low=vals.lower()
              if any(x in low for x in ('apk','download','d1d262450','262450','android')):
                  print(tag, vals)

          print('--- URL candidates ---')
          import re
          seen=set()
          for u in re.findall(r'https?://[^"\'<> ]+|(?:href|action|src)=["\']([^"\']+)', html, flags=re.I):
              if isinstance(u, tuple):
                  u=next((x for x in u if x), '')
              if not u: continue
              full=urljoin(base,u)
              if full in seen: continue
              seen.add(full)
              if any(x in full.lower() for x in ('download','apk','262450','d1d262450')):
                  print(full)
          PY
          grep -Ein 'download|\.apk|262450|d1d262450|form|action=' work/page.html | head -n 300 || true
