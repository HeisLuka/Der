name: Discover old Canyua package source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-old-canyua.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Aptoide public version API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          VERSIONS='https://ws75.aptoide.com/api/7/listAppVersions?package_name=com.canyua.publisherexpert&limit=100'
          curl -L --fail --compressed "$VERSIONS" -o work/versions.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("work/versions.json").read_text())
          items=((data.get("datalist") or {}).get("list") or [])
          for x in items:
              f=x.get("file") or {}
              print(f.get("vername"), f.get("vercode"), f.get("md5sum"), f.get("path"), f.get("filesize") or f.get("size"))
          target=next((x for x in items if (x.get("file") or {}).get("vername")=="3.1.10"), None)
          if not target:
              raise SystemExit("3.1.10 not present in Aptoide version API")
          f=target["file"]
          Path("work/target.json").write_text(json.dumps({
              "vername":f.get("vername"),
              "vercode":f.get("vercode"),
              "md5sum":f.get("md5sum"),
              "path":f.get("path"),
              "size":f.get("filesize") or f.get("size"),
              "signature":f.get("signature"),
          }, indent=2)+"\n")
          print("--- target ---")
          print(Path("work/target.json").read_text())
          PY

      - name: Download target and inspect protection markers
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python3 -c 'import json; print(json.load(open("work/target.json"))["path"])')"
          curl -L --fail --retry 3 "$URL" -o work/canyua-3.1.10.apk
          sha256sum work/canyua-3.1.10.apk | tee work/sha256.txt
          unzip -Z1 work/canyua-3.1.10.apk | grep -Ei 'pairip|licensecheck|libmspub|libpubBuilder|\.so$' | head -n 300 | tee work/markers.txt || true
          python3 - <<'PY'
          import zipfile, re
          z=zipfile.ZipFile("work/canyua-3.1.10.apk")
          hits=[]
          for name in z.namelist():
              if not (name.endswith(".dex") or name=="AndroidManifest.xml"):
                  continue
              b=z.read(name)
              for pat in [b"com/pairip",b"licensecheck",b"libmspub",b"pubBuilder"]:
                  if pat.lower() in b.lower():
                      hits.append((name,pat.decode()))
          print("binary marker hits:",hits)
          open("work/binary-markers.txt","w").write(repr(hits)+"\n")
          PY

      - name: Upload metadata only
        uses: actions/upload-artifact@v4
        with:
          name: old-canyua-discovery-metadata
          path: |
            work/versions.json
            work/target.json
            work/sha256.txt
            work/markers.txt
            work/binary-markers.txt
          if-no-files-found: error
          retention-days: 30
