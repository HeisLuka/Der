name: Analyze Canyua Contents pre-chunk table

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/analyze-canyua-prechunk-table.py"
      - "experiments/probe-canyua-contents-profile.py"
      - "experiments/analyze-canyua-pretable-xrefs.py"
      - ".github/workflows/canyua-prechunk-table.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Find saved Canyua package artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=package-canyua-publisher&per_page=20" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Extract base APK
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/package
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > work/package.zip
          unzip -q work/package.zip -d work/package
          XAPK="$(find work/package -type f -name '*.xapk' -print -quit)"
          test -n "$XAPK"
          unzip -p "$XAPK" com.canyua.publisherexpert.apk > work/base.apk
          test "$(stat -c %s work/base.apk)" -gt 100000000

      - name: Analyze 143-entry table across all templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check olefile
          python3 experiments/analyze-canyua-prechunk-table.py work/base.apk \
            --out work/canyua-prechunk-variability

      - name: Validate entry-139 profile discriminator
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/probe-canyua-contents-profile.py             --apk-corpus work/base.apk             --assert-known-corpus             --json work/canyua-prechunk-variability/entry139-profile.json

      - name: Scan pre-chunk field-0x03 values outside the table
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/analyze-canyua-pretable-xrefs.py             work/base.apk             --out work/canyua-prechunk-variability/field03-xrefs.json

      - name: Print summary
        run: |
          cat work/canyua-prechunk-variability/SUMMARY.md
          echo
          cat work/canyua-prechunk-variability/entry139-profile.json
          echo
          python3 - <<'PY'
          import json
          p="work/canyua-prechunk-variability/field03-xrefs.json"
          d=json.load(open(p))
          print(json.dumps({
              "distinct_field03_values": d["distinct_field03_values"],
              "values_with_external_occurrence_count": d["values_with_external_occurrence_count"],
              "values_with_external_occurrences": d["values_with_external_occurrences"],
          }, indent=2))
          PY

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: canyua-contents-prechunk-variability
          path: work/canyua-prechunk-variability/
          retention-days: 30
