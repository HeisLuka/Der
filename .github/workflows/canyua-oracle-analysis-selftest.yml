name: Canyua oracle analysis self-test

on:
  pull_request:
    paths:
      - ".github/workflows/canyua-oracle-analysis-selftest.yml"
      - "experiments/diff-pub-cfb.py"
      - "experiments/analyze-canyua-oracle-bundle.py"
      - "experiments/probe-canyua-contents-profile.py"
      - "experiments/analyze-canyua-prechunk-table.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run physical diff self-test
        run: python3 experiments/diff-pub-cfb.py --self-test
      - name: Run oracle bundle self-test
        run: python3 experiments/analyze-canyua-oracle-bundle.py --self-test
