name: Analyze PUB PAGE seq263

on:
  push:
    paths:
      - "experiments/analyze-canyua-page263.py"
      - "experiments/generate-pub2c-page263.py"
      - ".github/workflows/canyua-page263.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find package artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=package-canyua-publisher&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p work/package
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > work/package.zip
          unzip -q work/package.zip -d work/package
          XAPK="$(find work/package -type f -name '*.xapk' -print -quit)"
          test -n "$XAPK"
          unzip -p "$XAPK" com.canyua.publisherexpert.apk > work/base.apk
      - name: Analyze PAGE seq263
        run: |
          python3 -m pip install --disable-pip-version-check olefile
          python3 experiments/analyze-canyua-page263.py work/base.apk --out work/page263
          python3 experiments/generate-pub2c-page263.py work/base.apk
      - name: Print summary
        run: cat work/page263/SUMMARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: canyua-page263-matrix
          path: work/page263/
          retention-days: 30
