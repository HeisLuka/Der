name: Canyua x86 native-bridge probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canyua-x86-nativebridge-probe.yml"
      - "experiments/probe-canyua-x86.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Download pinned Canyua package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/canyua work/apks work/results
          gh run download 36275409853 --repo HeisLuka/Der --name package-canyua-publisher --dir work/canyua
          XAPK="$(find work/canyua -type f -name '*.xapk' | head -n1)"
          test -n "$XAPK"
          unzip -q "$XAPK" -d work/apks
          ls -lh work/apks/*.apk

      - name: Probe x86 native bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          disk-size: 6G
          disable-animations: true
          emulator-options: >-
            -no-snapshot
            -noaudio
            -no-boot-anim
            -no-window
            -no-metrics
            -gpu swiftshader_indirect
          script: bash experiments/probe-canyua-x86.sh

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canyua-x86-nativebridge-probe
          path: work/results/
          if-no-files-found: warn
          retention-days: 30
